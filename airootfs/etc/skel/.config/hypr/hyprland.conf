# --- Hyprland Basic Configuration ---
# Set monitor to automatic detection
monitor=,preferred,auto,auto

# --- Input Settings ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

# --- General Appearance ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# --- Decorations ---
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Startup Applications ---
# Execute waybar on startup
exec-once = waybar

# --- Keybindings (Basic) ---
# Example: Launch Kitty terminal
bind = SUPER, Q, exec, kitty
# Exit Hyprland
bind = SUPER, M, exit